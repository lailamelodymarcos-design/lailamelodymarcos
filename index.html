<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal World</title>
    <style>
        /* Base styles to make it look clean */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* The Splash/Enter Screen overlay */
        #enter-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
        }

        #enter-button {
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 2px solid #fff;
            padding: 15px 30px;
            transition: all 0.3s ease;
        }

        #enter-button:hover {
            background-color: #fff;
            color: #000;
        }

        /* The actual website content (hidden at start) */
        #main-content {
            display: none;
            padding: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- ENTER SCREEN -->
    <div id="enter-screen" onclick="enterSite()">
        <div id="enter-button">ENTER</div>
    </div>

    <!-- MAIN WEBSITE CONTENT -->
    <div id="main-content">
        <h1>Welcome to My Archive</h1>
        <p>This is the start of something amazing.</p>
        
        <!-- Placeholder for your audio track -->
        <div id="music-container"></div>
    </div>

    <script>
        function enterSite() {
            // 1. Hide the enter screen
            document.getElementById('enter-screen').style.display = 'none';
            
            // 2. Show the main website
            document.getElementById('main-content').style.display = 'block';
            
            // 3. Trigger music functions here later
            playMusic();
        }

        function playMusic() {
            console.log("Music triggered!");
        }
    </script>

</body>
</html>
